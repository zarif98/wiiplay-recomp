schema_version: 1
workspace_root: ../..

# Wii Play (North America, RHAE01): code lives entirely in main.dol (no RELs).
# Tanks! is RPTnkScene.
project:
  id: wiiplay-rhae01
  display_name: "Wii Play (USA)"
  game_id: RHAE01
  region: E
  base_manifest_format: wiiplay-recomp-base-manifest
  base_manifest_stem: wiiplay_base

memory:
  base: 0x80000000
  size: 0x01800000
  # __init_registers (0x80006290): r13 = _SDA_BASE_, r2 = _SDA2_BASE_
  sda_base: 0x80442AC0
  sda2_base: 0x80444B00

inputs:
  dol:
    path: extracted/sys/main.dol
    sha256: ef8a9e3069168ac2f6f664ab5258a320dd4b748ff46d0f6142435801c1d49447

translation:
  entry_points:
    - 0x80006124
  # Generated by scripts/make_function_map.py (bl targets, data pointers, prologues).
  function_map:
    path: projects/wiiplay/MAP.txt
  allow_unsupported_instructions: true

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: build/base/wiiplay_base_manifest.json
